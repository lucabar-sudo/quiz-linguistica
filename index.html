    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <style>

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        header { position: sticky; top: 0; background: var(--bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 100; padding: calc(1rem + var(--safe-top)) 1rem 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--header-border); background-color: rgba(var(--bg), 0.7); }

        .progress-wrapper { position: sticky; top: calc(70px + var(--safe-top)); height: 3px; background: var(--surface); z-index: 100; width: 100%; } .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light)); width: 0%; transition: width 0.3s ease; }
        main { padding: 2rem 1rem calc(100px + var(--safe-bottom)); flex-grow: 1; display: flex; flex-direction: column; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 80% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); } }
        .slide-in { animation: slideIn 0.4s ease forwards; }
        .question-card { background: var(--surface); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 8px 24px rgba(0,0,0,0.1); } .question-card h2 { font-size: 1.25rem; font-weight: 600; }
        .option-btn { display: flex; align-items: center; width: 100%; background: var(--surface); border: 2px solid transparent; color: var(--text); padding: 1rem 1.2rem; margin-bottom: 0.8rem; border-radius: 12px; font-size: 1rem; font-family: inherit; cursor: pointer; text-align: left; transition: all 0.2s; }
        .option-btn:hover:not(:disabled) { background: var(--surface-hover); } .option-btn:active:not(:disabled) { transform: scale(0.98); } .option-btn.correct { background: rgba(52, 211, 153, 0.1); border-color: var(--green); color: var(--green); } .option-btn.wrong { background: rgba(248, 113, 113, 0.1); border-color: var(--red); color: var(--red); } .option-btn:disabled { cursor: not-allowed; opacity: 0.6; }
        .key-badge { background: var(--bg); color: var(--subtext); font-family: 'JetBrains Mono', monospace; padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; margin-right: 12px; }
        .feedback-text { text-align: center; font-weight: 600; font-size: 1.2rem; margin-top: 1rem; min-height: 2rem; } .text-green { color: var(--green); } .text-red { color: var(--red); }
        .bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 700px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 1rem 1rem calc(1rem + var(--safe-bottom)); display: flex; justify-content: center; border-top: 1px solid var(--header-border); z-index: 100; }
        [data-theme="mocha"] .bottom-bar, [data-theme="oled"] .bottom-bar { background: rgba(15, 15, 26, 0.8); } [data-theme="light"] .bottom-bar { background: rgba(255, 255, 255, 0.8); }
        .btn-primary { background: var(--accent); color: #fff; border: none; padding: 1rem 2rem; border-radius: 12px; font-size: 1.1rem; font-weight: 600; font-family: inherit; cursor: pointer; width: 100%; transition: all 0.2s; text-align:center;} .btn-primary:active:not(:disabled) { transform: scale(0.96); } .btn-primary:disabled { background: var(--surface); color: var(--subtext); cursor: not-allowed; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay-bg); z-index: 200; display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s; } .overlay.active { opacity: 1; pointer-events: all; }
        .overlay-content { background: var(--bg); width: 100%; max-width: 700px; height: 85vh; border-radius: 24px 24px 0 0; padding: 1.5rem; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); border-top: 1px solid var(--header-border); } .overlay.active .overlay-content { transform: translateY(0); }
        .overlay-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; } .overlay-header h3 { font-size: 1.5rem; } .overlay-body { overflow-y: auto; flex-grow: 1; padding-bottom: 2rem; }
        .setting-group { margin-bottom: 1.5rem; } .setting-group h4 { margin-bottom: 0.8rem; color: var(--subtext); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;}
        .mode-selector { display: flex; flex-direction: column; gap: 0.5rem; } .mode-btn { background: var(--surface); color: var(--text); border: 2px solid transparent; padding: 1rem; border-radius: 12px; cursor: pointer; text-align: left; font-family: inherit; font-size: 1rem; font-weight: 600; } .mode-btn.active { border-color: var(--accent); background: rgba(124, 106, 245, 0.1); } [data-theme="light"] .mode-btn.active { background: rgba(94, 75, 216, 0.1); } .mode-btn span { display: block; font-size: 0.8rem; font-weight: 400; color: var(--subtext); margin-top: 4px; }
        .stepper-container { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; } .stepper-btn { background: var(--surface); border: none; color: var(--text); width: 40px; height: 40px; border-radius: 8px; font-size: 1.2rem; cursor: pointer;} .stepper-val { font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 700; width: 50px; text-align: center; }
        .presets { display: flex; flex-wrap: wrap; gap: 0.5rem; } .preset-btn { background: var(--surface); border: none; color: var(--text); padding: 0.5rem 1rem; border-radius: 8px; font-family: 'JetBrains Mono'; cursor: pointer;} .preset-btn.active { background: var(--accent); color: #fff;} .preset-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 0.5rem; margin-top: 1rem; } .lesson-item { background: var(--surface); text-align: center; padding: 0.8rem 0.5rem; border-radius: 8px; cursor: pointer; border: 2px solid transparent; } .lesson-item.active { border-color: var(--green); background: rgba(52, 211, 153, 0.1); } .lesson-item .l-num { font-weight: 700; font-family: 'JetBrains Mono'; } .lesson-item .l-count { font-size: 0.75rem; color: var(--subtext); margin-top: 4px;}
        .lesson-controls { display: flex; gap: 0.5rem; margin-top: 0.8rem; } .lesson-controls button { flex:1; background: var(--surface); color: var(--text); border: none; padding: 0.5rem; border-radius: 6px; cursor: pointer;}
        .toggle-switch { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 1rem; border-radius: 12px; } .switch { position: relative; display: inline-block; width: 50px; height: 28px; } .switch input { opacity: 0; width: 0; height: 0; } .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--bg); transition: .3s; border-radius: 28px; border: 1px solid var(--subtext);} .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: var(--subtext); transition: .3s; border-radius: 50%; } input:checked + .slider { background-color: var(--accent); border-color: var(--accent);} input:checked + .slider:before { transform: translateX(22px); background-color: #fff;}
        .final-stats { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding-top: 2rem;} .percentage-ring { margin: 2rem auto; font-family: 'JetBrains Mono', monospace; font-size: 4rem; font-weight: 700; animation: popIn 0.6s ease; } .p-green { color: var(--green); text-shadow: 0 0 20px rgba(52,211,153,0.3); } .p-yellow { color: var(--yellow); text-shadow: 0 0 20px rgba(251,191,36,0.3); } .p-red { color: var(--red); text-shadow: 0 0 20px rgba(248,113,113,0.3); } .final-emoji { font-size: 3.5rem; margin-bottom: 0.5rem; } .final-label { font-size: 1.2rem; font-weight: 600; color: var(--subtext); margin-bottom: 2rem; } .final-buttons { display: flex; gap: 1rem; width: 100%; }
        .history-item { background: var(--surface); padding: 1rem; border-radius: 12px; margin-bottom: 1rem; text-align: left;} .history-item h4 { font-size: 1rem; margin-bottom: 0.8rem; color: var(--text);} .h-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; font-size: 0.9rem;} .h-label { color: var(--subtext); font-size: 0.8rem;}

<body>
<div class="container">
    <header>
        <div class="header-title" id="headerTitle">QUIZ LATINO</div>
        <div>
            <button id="btnStats" class="icon-btn" title="Statistiche">📊</button>
            <button id="btnSettings" class="icon-btn" title="Impostazioni">⚙️</button>
        </div>
    </header>
    <div class="progress-wrapper"><div class="progress-bar" id="progressBar"></div></div>
    <main id="mainContent">
        <div id="quizScreen">
            <div class="question-card slide-in" id="qCard"><h2 id="questionText">...</h2></div>
            <div class="options-container slide-in" id="optionsContainer" style="animation-delay: 0.1s"></div>
            <div id="feedbackText" class="feedback-text slide-in" style="animation-delay: 0.2s"></div>
        </div>
        <div id="finalScreen" class="hidden final-stats">
            <div class="final-emoji" id="fEmoji"></div>
            <div class="percentage-ring" id="fPercent"></div>
            <div class="final-label" id="fLabel"></div>
            <div class="final-buttons">
                <button class="btn-primary" style="background:var(--surface); color:var(--text)" onclick="openStats()">Vedi errori</button>
                <button class="btn-primary" onclick="initQuiz()">Nuovo Quiz</button>
            </div>
        </div>
    </main>
    <div class="bottom-bar" id="bottomBar"><button id="btnNext" class="btn-primary" disabled>Avanti →</button></div>
    <div id="settingsOverlay" class="overlay">
        <div class="overlay-content">
            <div class="overlay-header"><h3>Impostazioni</h3><button class="icon-btn" onclick="closeSettings()">✕</button></div>
            <div class="overlay-body">
                <div class="setting-group">
                    <h4>Tema Visivo</h4>
                    <div class="presets" id="themePresets">
                        <button class="preset-btn theme-btn" data-theme-id="mocha" onclick="setTheme('mocha')">Scuro</button>
                        <button class="preset-btn theme-btn" data-theme-id="light" onclick="setTheme('light')">Chiaro</button>
                        <button class="preset-btn theme-btn" data-theme-id="oled" onclick="setTheme('oled')">OLED</button>
                    </div>
                </div>
                <div class="setting-group">
                    <h4>Modalità</h4>
                    <div class="mode-selector">
                        <button class="mode-btn" data-mode="all" onclick="setMode('all')">Tutte le lezioni <span>Pesca dal pool completo</span></button>
                        <button class="mode-btn" data-mode="select" onclick="setMode('select')">Scegli lezioni <span>Seleziona lezioni specifiche</span></button>
                        <button class="mode-btn" data-mode="refine" onclick="setMode('refine')">Perfezionamento <span>Ripeti le domande più sbagliate</span></button>
                    </div>
                </div>
                <div id="lessonSelector" class="setting-group hidden">
                    <h4>Seleziona Lezioni</h4>
                    <div class="lesson-controls"><button onclick="selectAllLessons(true)">Tutte</button><button onclick="selectAllLessons(false)">Nessuna</button></div>
                    <div class="lessons-grid" id="lessonsGrid"></div>
                </div>
                <div id="refineStats" class="setting-group hidden">
                    <h4>Statistiche Errori</h4>
                    <div style="background:var(--surface); padding:1rem; border-radius:8px; margin-bottom:0.8rem;" id="errorStatsText"></div>
                    <button style="width:100%; background:transparent; border:1px solid var(--red); color:var(--red); padding:0.5rem; border-radius:6px; cursor:pointer;" onclick="resetErrors()">Azzera errori</button>
                </div>
                <div class="setting-group">
                    <h4>Numero Domande <span id="poolSizeBadge" style="float:right; font-family:'JetBrains Mono'; color:var(--accent);"></span></h4>
                    <div class="stepper-container">
                        <button class="stepper-btn" onclick="changeNum(-1)">−</button><div class="stepper-val" id="numQuestionsVal">10</div><button class="stepper-btn" onclick="changeNum(1)">+</button>
                    </div>
                    <div class="presets" id="numPresets">
                        <button class="preset-btn" onclick="setNum(10)">10</button><button class="preset-btn" onclick="setNum(20)">20</button><button class="preset-btn" onclick="setNum(50)">50</button><button class="preset-btn" onclick="setNum(100)">100</button><button class="preset-btn" onclick="setNum(9999)">Tutte</button>
                    </div>
                </div>
                <div class="setting-group" id="orderToggleGroup">
                    <h4>Ordine</h4>
                    <div class="toggle-switch"><span>Casuale</span><label class="switch"><input type="checkbox" id="orderToggle"><span class="slider"></span></label></div>
                </div>
            </div>
            <div style="margin-top: 1rem; display:flex; gap:1rem;">
                <button class="btn-primary" style="background:var(--surface); color:var(--text); padding: 1rem;" onclick="closeSettings()">Annulla</button>
                <button class="btn-primary" id="btnApply" style="padding: 1rem;" onclick="applySettings()">Applica e Riavvia</button>
            </div>
        </div>
    </div>
    <div id="statsOverlay" class="overlay">
        <div class="overlay-content">
            <div class="overlay-header"><h3>Riepilogo Sessione</h3><button class="icon-btn" onclick="closeStats()">✕</button></div>
            <div class="overlay-body" id="statsList"></div>
        </div>
    </div>
</div>

const STORAGE_KEY = 'quiz_latino_errors'; const THEME_KEY = 'quiz_latino_theme';
let appState = { mode: 'all', selectedLessons: new Set(), numQs: 20, isRandom: true };
let currentQuiz = [], currentIndex = 0, score = 0, hasAnswered = false, sessionHistory = []; 

document.addEventListener('DOMContentLoaded', () => { setTheme(localStorage.getItem(THEME_KEY) || 'mocha'); buildLessonGrid(); initQuiz(); });
function setTheme(themeName) { document.documentElement.setAttribute('data-theme', themeName); localStorage.setItem(THEME_KEY, themeName); document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active')); const act = document.querySelector(`.theme-btn[data-theme-id="${themeName}"]`); if(act) act.classList.add('active'); }
function shuffle(array) { let arr = [...array]; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function getErrorDict() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
function recordError(qText) { let errs = getErrorDict(); errs[qText] = (errs[qText] || 0) + 1; localStorage.setItem(STORAGE_KEY, JSON.stringify(errs)); }
function getUniqueLessons() { return Array.from(new Set(ALL_QUESTIONS.map(q => q.lezione))).sort((a,b)=>a-b); }
function getAvailablePool() { if (appState.mode === 'all') return ALL_QUESTIONS; if (appState.mode === 'select') return ALL_QUESTIONS.filter(q => appState.selectedLessons.has(q.lezione)); if (appState.mode === 'refine') { const errors = getErrorDict(); return ALL_QUESTIONS.filter(q => errors[q.question] > 0).sort((a,b) => errors[b.question] - errors[a.question]); } return []; }

function initQuiz() { document.getElementById('finalScreen').classList.add('hidden'); document.getElementById('quizScreen').classList.remove('hidden'); document.getElementById('bottomBar').classList.remove('hidden'); let pool = getAvailablePool(); if(pool.length === 0) { alert("Nessuna domanda disponibile per questa selezione."); openSettings(); return; } if (appState.isRandom && appState.mode !== 'refine') pool = shuffle(pool); currentQuiz = pool.slice(0, Math.min(appState.numQs, pool.length)); currentIndex = 0; score = 0; sessionHistory = []; renderQuestion(); }
function renderQuestion() { hasAnswered = false; const q = currentQuiz[currentIndex]; const isRefine = appState.mode === 'refine'; const errorCount = isRefine ? getErrorDict()[q.question] : null; let headerTxt = `DOMANDA ${currentIndex + 1}/${currentQuiz.length} · LEZ. ${q.lezione}`; if (isRefine) headerTxt += ` · <span style="color:var(--red)">×${errorCount} errori</span>`; document.getElementById('headerTitle').innerHTML = headerTxt; document.getElementById('progressBar').style.width = `${(currentIndex / currentQuiz.length) * 100}%`; const qCard = document.getElementById('qCard'), optsContainer = document.getElementById('optionsContainer'), fText = document.getElementById('feedbackText'), btnNext = document.getElementById('btnNext'); qCard.classList.remove('slide-in'); optsContainer.classList.remove('slide-in'); void qCard.offsetWidth; qCard.classList.add('slide-in'); optsContainer.classList.add('slide-in'); document.getElementById('questionText').textContent = q.question; fText.textContent = ''; fText.className = 'feedback-text'; btnNext.disabled = true; btnNext.textContent = (currentIndex === currentQuiz.length - 1) ? "Risultati →" : "Avanti →"; let ops = shuffle([...q.options]); optsContainer.innerHTML = ''; ops.forEach((opt, idx) => { const btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerHTML = `<span class="key-badge">${idx + 1}</span> ${opt.text}`; btn.onclick = () => handleAnswer(btn, opt, ops); optsContainer.appendChild(btn); }); }
function handleAnswer(btn, selectedOpt, allOpts) { if (hasAnswered) return; hasAnswered = true; const q = currentQuiz[currentIndex]; const isCorrect = selectedOpt.is_correct; const correctOpt = allOpts.find(o => o.is_correct); const btns = document.querySelectorAll('.option-btn'); btns.forEach(b => b.disabled = true); if (isCorrect) { btn.classList.add('correct'); document.getElementById('feedbackText').textContent = '✅ Corretto!'; document.getElementById('feedbackText').classList.add('text-green'); score++; } else { btn.classList.add('wrong'); btns[allOpts.findIndex(o => o.is_correct)].classList.add('correct'); document.getElementById('feedbackText').textContent = '❌ Sbagliato!'; document.getElementById('feedbackText').classList.add('text-red'); recordError(q.question); } sessionHistory.push({ question: q.question, given: selectedOpt.text, correct: correctOpt.text, isCorrect: isCorrect }); document.getElementById('btnNext').disabled = false; document.getElementById('progressBar').style.width = `${((currentIndex + 1) / currentQuiz.length) * 100}%`; }
document.getElementById('btnNext').onclick = () => { if (currentIndex < currentQuiz.length - 1) { currentIndex++; renderQuestion(); } else { showFinalScreen(); } };
function showFinalScreen() { document.getElementById('quizScreen').classList.add('hidden'); document.getElementById('bottomBar').classList.add('hidden'); document.getElementById('finalScreen').classList.remove('hidden'); const perc = Math.round((score / currentQuiz.length) * 100), ring = document.getElementById('fPercent'), emoji = document.getElementById('fEmoji'), label = document.getElementById('fLabel'); ring.className = 'percentage-ring'; ring.textContent = `${perc}%`; if (perc >= 80) { ring.classList.add('p-green'); emoji.textContent = '🏆'; label.textContent = 'Eccellente!'; } else if (perc >= 60) { ring.classList.add('p-yellow'); emoji.textContent = '👍'; label.textContent = 'Buon lavoro!'; } else { ring.classList.add('p-red'); emoji.textContent = '📚'; label.textContent = 'Da ripassare.'; } const sList = document.getElementById('statsList'); sList.innerHTML = `<div style="text-align:center; margin-bottom:1.5rem"><div style="font-size:2rem; font-weight:bold">${score}/${currentQuiz.length}</div><div style="color:var(--subtext)">Risposte corrette</div></div>`; sessionHistory.forEach((item, i) => { const div = document.createElement('div'); div.className = 'history-item'; div.innerHTML = `<h4>${i+1}. ${item.question}</h4><div class="h-row"><span class="h-label">Tua risposta:</span><span style="color: ${item.isCorrect ? 'var(--green)' : 'var(--red)'}">${item.given}</span></div>${!item.isCorrect ? `<div class="h-row"><span class="h-label">Risposta corretta:</span><span style="color: var(--green)">${item.correct}</span></div>` : ''}`; sList.appendChild(div); }); }
document.getElementById('btnSettings').onclick = () => { updateSettingsUI(); document.getElementById('settingsOverlay').classList.add('active'); }; function closeSettings() { document.getElementById('settingsOverlay').classList.remove('active'); } function openStats() { document.getElementById('statsOverlay').classList.add('active'); } function closeStats() { document.getElementById('statsOverlay').classList.remove('active'); }
function setMode(mode) { appState.mode = mode; document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active')); document.querySelector(`.mode-btn[data-mode="${mode}"]`).classList.add('active'); document.getElementById('lessonSelector').classList.add('hidden'); document.getElementById('refineStats').classList.add('hidden'); document.getElementById('orderToggleGroup').classList.remove('hidden'); if (mode === 'select') document.getElementById('lessonSelector').classList.remove('hidden'); else if (mode === 'refine') { document.getElementById('refineStats').classList.remove('hidden'); document.getElementById('orderToggleGroup').classList.add('hidden'); updateRefineStats(); } updatePoolBadges(); }
function buildLessonGrid() { const grid = document.getElementById('lessonsGrid'); grid.innerHTML = ''; const lessons = getUniqueLessons(), counts = {}; ALL_QUESTIONS.forEach(q => counts[q.lezione] = (counts[q.lezione]||0)+1); lessons.forEach(l => { appState.selectedLessons.add(l); const div = document.createElement('div'); div.className = 'lesson-item active'; div.innerHTML = `<div class="l-num">L${l}</div><div class="l-count">${counts[l]} dom.</div>`; div.onclick = () => { if (appState.selectedLessons.has(l)) { appState.selectedLessons.delete(l); div.classList.remove('active'); } else { appState.selectedLessons.add(l); div.classList.add('active'); } updatePoolBadges(); }; grid.appendChild(div); }); }
function selectAllLessons(selAll) { const lessons = getUniqueLessons(); const items = document.querySelectorAll('.lesson-item'); if (selAll) { lessons.forEach(l => appState.selectedLessons.add(l)); items.forEach(i => i.classList.add('active')); } else { appState.selectedLessons.clear(); items.forEach(i => i.classList.remove('active')); } updatePoolBadges(); }
function updateRefineStats() { const errs = getErrorDict(), txt = document.getElementById('errorStatsText'); let tot = 0, list = []; for (let k in errs) { tot += errs[k]; list.push({q: k, count: errs[k]}); } if (tot === 0) txt.innerHTML = "<span style='color:var(--subtext)'>Nessun errore registrato.</span>"; else { list.sort((a,b) => b.count - a.count); let html = `Totale errori: <b>${tot}</b><br><br><span style="font-size:0.8rem; color:var(--subtext)">TOP SBAGLIATE:</span><ul style="font-size:0.85rem; margin-left:1.2rem; margin-top:0.5rem; color:var(--subtext)">`; list.slice(0,8).forEach(i => html += `<li>${i.q.substring(0, 30)}... <b style="color:var(--red)">(${i.count})</b></li>`); txt.innerHTML = html + "</ul>"; } }
function resetErrors() { if (confirm("Cancellare le statistiche?")) { localStorage.removeItem(STORAGE_KEY); updateRefineStats(); updatePoolBadges(); } }
function changeNum(delta) { setNum(appState.numQs + delta); } function setNum(val) { const size = getAvailablePool().length; let n = val; if (n < 1) n = 1; if (n > size) n = size; appState.numQs = n; document.getElementById('numQuestionsVal').textContent = (n === size && val === 9999) ? "Tutte" : n; updatePresets(); }
function updatePoolBadges() { const size = getAvailablePool().length; document.getElementById('poolSizeBadge').textContent = `Disponibili: ${size}`; document.getElementById('btnApply').disabled = (size === 0); setNum(appState.numQs); }
function updatePresets() { const size = getAvailablePool().length; document.querySelectorAll('.preset-btn:not(.theme-btn)').forEach(btn => { const valText = btn.textContent; const val = valText === 'Tutte' ? 9999 : parseInt(valText); btn.classList.remove('active'); btn.disabled = (valText !== 'Tutte' && val > size); if (appState.numQs === val || (val === 9999 && appState.numQs === size)) btn.classList.add('active'); }); }
function updateSettingsUI() { setMode(appState.mode); document.getElementById('orderToggle').checked = !appState.isRandom; updatePoolBadges(); }
function applySettings() { appState.isRandom = !document.getElementById('orderToggle').checked; closeSettings(); initQuiz(); }
document.addEventListener('keydown', (e) => { if (document.getElementById('settingsOverlay').classList.contains('active')) return; if (e.key >= '1' && e.key <= '4') { const btns = document.querySelectorAll('.option-btn'); if (btns[parseInt(e.key) - 1] && !btns[parseInt(e.key) - 1].disabled) btns[parseInt(e.key) - 1].click(); } if (e.key === 'Enter') { const btnNext = document.getElementById('btnNext'); if (!btnNext.disabled && !document.getElementById('bottomBar').classList.contains('hidden')) btnNext.click(); } });
</script>
</body>
