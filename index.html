<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz Linguistica">
<meta name="theme-color" content="#0f0f1a">
<title>Quiz Linguistica Italiana — 24 Domande</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --bg: #0f0f1a;
  --surface: #171728;
  --surface2: #1e1e33;
  --border: #2a2a45;
  --text: #e8e8f0;
  --muted: #7070a0;
  --accent: #7c6af5;
  --accent2: #a78bfa;
  --green: #34d399;
  --green-bg: #052e20;
  --red: #f87171;
  --red-bg: #2e0505;
  --yellow: #fbbf24;
  --radius: 16px;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  min-height: -webkit-fill-available;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* Ambient background */
body::before {
  content: '';
  position: fixed;
  top: -200px; left: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(124,106,245,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* HEADER */
.header {
  padding: calc(16px + var(--safe-top)) 20px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  z-index: 10;
  border-bottom: 1px solid var(--border);
  background: rgba(15,15,26,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
}

.header-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.header-badge {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: var(--accent2);
}

/* PROGRESS */
.progress-wrap {
  padding: 16px 20px 0;
  position: relative;
  z-index: 1;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 0.8rem;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}

.progress-track {
  height: 4px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%;
}

/* MAIN */
main {
  flex: 1;
  padding: 20px;
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
}

/* QUESTION */
.question-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.question-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
}

.question-num {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent2);
  margin-bottom: 10px;
  font-family: 'JetBrains Mono', monospace;
}

.question-text {
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 1.55;
  color: var(--text);
}

/* OPTIONS */
.options-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.option {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: border-color 0.15s, background 0.15s, transform 0.1s;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

.option:active:not(.disabled) {
  transform: scale(0.985);
}

.option:hover:not(.disabled) {
  border-color: var(--accent);
  background: var(--surface2);
}

.option-key {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--accent2);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
}

.option-text {
  font-size: 0.95rem;
  line-height: 1.45;
  color: var(--text);
  flex: 1;
}

.option.correct {
  border-color: var(--green);
  background: var(--green-bg);
}
.option.correct .option-key {
  background: var(--green);
  border-color: var(--green);
  color: #000;
}
.option.correct .option-text { color: var(--green); }

.option.wrong {
  border-color: var(--red);
  background: var(--red-bg);
}
.option.wrong .option-key {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.option.wrong .option-text { color: var(--red); }

.option.disabled { cursor: default; }

/* FEEDBACK */
.feedback {
  text-align: center;
  font-size: 1rem;
  font-weight: 600;
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 10px;
  padding: 8px;
  transition: all 0.3s;
}
.feedback.correct { color: var(--green); background: var(--green-bg); }
.feedback.wrong { color: var(--red); background: var(--red-bg); }

/* BOTTOM */
.bottom-bar {
  padding: 12px 20px calc(16px + var(--safe-bottom));
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--border);
  background: rgba(15,15,26,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  bottom: 0;
  z-index: 10;
  max-width: 100%;
  gap: 10px;
}

.btn-group { display: flex; gap: 8px; }

button {
  font-family: 'Sora', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 10px 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  white-space: nowrap;
}

button:active { transform: scale(0.96); }
button:disabled { opacity: 0.3; cursor: default; transform: none; }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
}

.btn-ghost {
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 10px 12px;
}

.btn-ghost:hover { color: var(--text); border-color: var(--muted); }

/* FINAL SCREEN */
#final-screen {
  display: none;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  gap: 16px;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
}

.final-emoji { font-size: 4rem; line-height: 1; }

.final-score {
  font-family: 'JetBrains Mono', monospace;
  font-size: 4rem;
  font-weight: 700;
  line-height: 1;
}
.final-score.great { color: var(--green); }
.final-score.ok { color: var(--yellow); }
.final-score.bad { color: var(--red); }

.final-label {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--text);
}

.final-sub {
  font-size: 0.95rem;
  color: var(--muted);
  line-height: 1.5;
}

.final-btns {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 8px;
}

/* STATS OVERLAY */
#stats-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 200;
  overflow-y: auto;
  padding: 20px;
  padding-top: calc(20px + var(--safe-top));
  padding-bottom: calc(20px + var(--safe-bottom));
}

.stats-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-width: 660px;
  margin: 0 auto;
  overflow: hidden;
}

.stats-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
}

.stats-header h2 {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
}

.stats-summary {
  padding: 12px 20px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  color: var(--accent2);
}

.stats-list { padding: 12px; }

.stat-item {
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
  border-left: 3px solid;
}

.stat-item.correct {
  background: var(--green-bg);
  border-color: var(--green);
}

.stat-item.wrong {
  background: var(--red-bg);
  border-color: var(--red);
}

.stat-q {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.4;
}

.stat-ans {
  font-size: 0.82rem;
  color: var(--red);
  margin-bottom: 2px;
}

.stat-correct {
  font-size: 0.82rem;
  color: var(--green);
}

/* Animations */
@keyframes slideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.question-card, .options-list { animation: slideIn 0.25s ease; }

@media (min-width: 600px) {
  .question-text { font-size: 1.1rem; }
  .option { padding: 16px 18px; }
  .option-text { font-size: 1rem; }
}
</style>
</head>
<body>

<div class="header">
  <span class="header-title">📖 Linguistica Italiana</span>
  <span class="header-badge" id="score-badge">0 / 0</span>
</div>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="progress-text">Domanda 1</span>
    <span id="progress-pct">0%</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>

<main id="quiz-main">
  <div id="quiz-screen" style="display:flex;flex-direction:column;gap:12px;">
    <div class="question-card" id="question-card">
      <div class="question-num" id="question-num">DOMANDA 1</div>
      <div class="question-text" id="question-text"></div>
    </div>
    <div class="options-list" id="options-list"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div id="final-screen">
    <div class="final-emoji" id="final-emoji"></div>
    <div class="final-score" id="final-score"></div>
    <div class="final-label" id="final-label"></div>
    <div class="final-sub" id="final-sub"></div>
    <div class="final-btns">
      <button class="btn-primary" onclick="restartQuiz()" style="padding:12px 28px;font-size:1rem;">🔄 Nuovo Quiz</button>
      <button class="btn-ghost" onclick="showStats()" style="padding:12px 20px;font-size:1rem;color:var(--text)">📊 Vedi errori</button>
    </div>
  </div>
</main>

<div class="bottom-bar">
  <div class="btn-group">
    <button class="btn-ghost" onclick="restartQuiz()" title="Nuovo quiz">🔄</button>
    <button class="btn-ghost" onclick="showStats()" title="Risultati">📊</button>
  </div>
  <button class="btn-primary" id="btn-next" disabled onclick="nextQuestion()">Avanti →</button>
</div>

<div id="stats-overlay" onclick="if(event.target===this)closeStats()">
  <div class="stats-box">
    <div class="stats-header">
      <h2>📊 Dettaglio risposte</h2>
      <button class="btn-ghost" onclick="closeStats()" style="padding:8px 14px;">✕</button>
    </div>
    <div class="stats-summary" id="stats-summary"></div>
    <div class="stats-list" id="stats-list"></div>
  </div>
</div>

const QUIZ_SIZE = 24;

let questions = [], currentIdx = 0, score = 0;
let answered = false, history = [], shuffledCorrectIdx = -1;
let shuffledTexts = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function restartQuiz() {
  closeStats();
  questions = shuffle(ALL_QUESTIONS).slice(0, QUIZ_SIZE);
  currentIdx = 0; score = 0; answered = false; history = [];
  document.getElementById('final-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'flex';
  document.getElementById('btn-next').style.display = '';
  showQuestion();
}

function showQuestion() {
  if (currentIdx >= questions.length) { showFinal(); return; }

  answered = false;
  const q = questions[currentIdx];
  const total = questions.length;
  const pct = Math.round(currentIdx / total * 100);

  document.getElementById('progress-text').textContent = `Domanda ${currentIdx + 1} di ${total}`;
  document.getElementById('progress-pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('score-badge').textContent = `${score} / ${currentIdx}`;
  document.getElementById('question-num').textContent = `DOMANDA ${currentIdx + 1}`;
  document.getElementById('question-text').textContent = q.question;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('btn-next').disabled = true;
  document.getElementById('btn-next').textContent = currentIdx + 1 >= total ? 'Risultati →' : 'Avanti →';

  const idxArr = q.options.map((_, i) => i);
  const shuffled = shuffle(idxArr);
  shuffledCorrectIdx = shuffled.indexOf(q.correct);
  shuffledTexts = shuffled.map(i => q.options[i].text);

  const letters = ['A', 'B', 'C', 'D'];
  const list = document.getElementById('options-list');
  list.innerHTML = '';

  shuffled.forEach((origIdx, pos) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = `<span class="option-key">${letters[pos]}</span><span class="option-text">${q.options[origIdx].text}</span>`;
    div.addEventListener('click', () => selectAnswer(pos));
    // Touch feedback
    div.addEventListener('touchstart', () => {}, {passive: true});
    list.appendChild(div);
  });
}

function selectAnswer(pos) {
  if (answered) return;
  answered = true;

  const isCorrect = pos === shuffledCorrectIdx;
  const opts = document.querySelectorAll('.option');

  opts.forEach((opt, i) => {
    opt.classList.add('disabled');
    if (i === shuffledCorrectIdx) opt.classList.add('correct');
    else if (i === pos) opt.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  if (isCorrect) {
    score++;
    fb.textContent = '✅ Corretto!';
    fb.className = 'feedback correct';
  } else {
    fb.textContent = '❌ Sbagliato!';
    fb.className = 'feedback wrong';
  }

  document.getElementById('score-badge').textContent = `${score} / ${currentIdx + 1}`;

  history.push({
    question: questions[currentIdx].question,
    isCorrect,
    selectedText: shuffledTexts[pos],
    correctText: shuffledTexts[shuffledCorrectIdx]
  });

  document.getElementById('btn-next').disabled = false;
}

function nextQuestion() {
  currentIdx++;
  showQuestion();
}

function showFinal() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('final-screen').style.display = 'flex';

  const total = questions.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-pct').textContent = '100%';

  let emoji, label, sub, cls;
  if (pct >= 80) { emoji = '🎉'; label = 'Ottimo risultato!'; cls = 'great'; }
  else if (pct >= 60) { emoji = '👍'; label = 'Buon lavoro!'; cls = 'ok'; }
  else { emoji = '📖'; label = 'Continua a studiare!'; cls = 'bad'; }

  sub = `Hai risposto correttamente a ${score} domande su ${total}.`;

  document.getElementById('final-emoji').textContent = emoji;
  document.getElementById('final-score').textContent = pct + '%';
  document.getElementById('final-score').className = 'final-score ' + cls;
  document.getElementById('final-label').textContent = label;
  document.getElementById('final-sub').textContent = sub;
  document.getElementById('score-badge').textContent = `${score} / ${total}`;
}

function showStats() {
  const list = document.getElementById('stats-list');
  const summary = document.getElementById('stats-summary');

  if (!history.length) {
    summary.textContent = 'Nessuna risposta ancora.';
    list.innerHTML = '';
  } else {
    const correct = history.filter(h => h.isCorrect).length;
    summary.textContent = `Punteggio: ${correct}/${history.length} — ${Math.round(correct/history.length*100)}% corretto`;
    list.innerHTML = history.map((h, i) => `
      <div class="stat-item ${h.isCorrect ? 'correct' : 'wrong'}">
        <div class="stat-q">${h.isCorrect ? '✅' : '❌'} D.${i+1}: ${h.question}</div>
        ${!h.isCorrect ? `
          <div class="stat-ans">✗ ${h.selectedText}</div>
          <div class="stat-correct">✓ ${h.correctText}</div>
        ` : ''}
      </div>`).join('');
  }
  document.getElementById('stats-overlay').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closeStats() {
  document.getElementById('stats-overlay').style.display = 'none';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (['1','2','3','4'].includes(e.key) && !answered) selectAnswer(+e.key - 1);
  if (e.key === 'Enter' && !document.getElementById('btn-next').disabled) nextQuestion();
});

restartQuiz();
</script>
